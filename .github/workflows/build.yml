name: Build Windows executables

on:
  push:
    tags: ["v*"]          # git tag v1.0 && git push --tags  -> builds + publishes a release
  workflow_dispatch:      # manual run from the Actions tab (artifacts only)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tinysa_panel/requirements.txt -r nanovna_panel/requirements.txt pyinstaller

      - name: Build tinySA panel
        working-directory: tinysa_panel
        run: pyinstaller --noconfirm --onefile --windowed --exclude-module pkg_resources --name tinySA_Panel tinysa_panel.py

      - name: Build NanoVNA panel
        working-directory: nanovna_panel
        run: pyinstaller --noconfirm --onefile --windowed --exclude-module pkg_resources --name NanoVNA_Panel vna_panel.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            tinysa_panel/dist/tinySA_Panel.exe
            nanovna_panel/dist/NanoVNA_Panel.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tinysa_panel/dist/tinySA_Panel.exe
            nanovna_panel/dist/NanoVNA_Panel.exe
